name: CI-CD Pipeline Runner

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage 1 - Build & Setup
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Stage 2 - Run Unit Tests
        run: |
          cd backend
          npm install
          npm test

      - name: Stage 3 - Docker Image Creation
        run: |
          docker build -t visualizer-sample:latest -f docker/Dockerfile .

      - name: Stage 4 - Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'visualizer-sample:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Stage 5 - Deployment
        run: |
          echo "Simulating deployment to target environment..."
          echo "Deployment completed successfully."
